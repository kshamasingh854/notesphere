<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NoteSphere</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main class="container">
    <header>
      <div>
        <p class="eyebrow">NOTES • IDEAS • REMINDERS</p>
        <h1>NoteSphere</h1>
        <p class="subtitle">A calm space for everything on your mind.</p>
      </div>
      <span class="status">Java 21 · Spring Boot</span>
    </header>

    <section class="panel">
      <h2 id="form-heading">Create a note</h2>
      <form id="note-form">
        <input type="hidden" id="note-id">
        <label for="title">Title</label>
        <input id="title" maxlength="150" placeholder="Give your note a title" required>
        <label for="content">Content</label>
        <textarea id="content" rows="4" placeholder="Write something worth remembering..." required></textarea>
        <div class="form-actions">
          <button type="submit" id="save-button">Save note</button>
          <button type="button" class="secondary hidden" id="cancel-button">Cancel</button>
          <span id="message" role="status"></span>
        </div>
      </form>
    </section>

    <section class="notes-section">
      <div class="section-heading">
        <h2>Your notes</h2>
        <button class="secondary" id="refresh-button" type="button">Refresh</button>
      </div>
      <div id="notes" class="notes-grid"></div>
      <p id="empty" class="empty hidden">No notes yet. Create your first note above.</p>
    </section>
  </main>
  <script src="/app.js"></script>
</body>
</html>
