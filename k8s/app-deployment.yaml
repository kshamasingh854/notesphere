apiVersion: apps/v1
kind: Deployment
metadata:
  name: notesphere
spec:
  replicas: 1
  selector:
    matchLabels:
      app: notesphere
  template:
    metadata:
      labels:
        app: notesphere
    spec:
      containers:
        - name: notesphere
          image: kshamasingh854/notesphere:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          env:
            - name: DB_HOST
              value: db-cont
            - name: DB_PORT
              value: "3306"
            - name: DB_NAME
              value: notesphere
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: notesphere-db-secret
                  key: DB_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: notesphere-db-secret
                  key: DB_PASSWORD
